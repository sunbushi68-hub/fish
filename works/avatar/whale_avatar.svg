<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2b52"/>
      <stop offset="55%" stop-color="#12527f"/>
      <stop offset="100%" stop-color="#1f8bb8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="60%" stop-color="#3fa9e6"/>
      <stop offset="100%" stop-color="#2277b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#9fe3ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="420" fill="url(#glow)"/>

  <g opacity="0.55" fill="#bfeaff">
    <circle cx="196" cy="286" r="26"/>
    <circle cx="252" cy="212" r="14"/>
    <circle cx="838" cy="330" r="20"/>
    <circle cx="790" cy="238" r="11"/>
    <circle cx="176" cy="742" r="16"/>
    <circle cx="864" cy="706" r="24"/>
  </g>

  <g opacity="0.35" stroke="#d8f4ff" stroke-width="6" fill="none">
    <path d="M120 520 C 170 490, 190 560, 240 528"/>
    <path d="M796 552 C 846 522, 866 592, 916 560"/>
  </g>

  <!-- tail fluke -->
  <path d="M352 566 C 286 528, 232 488, 168 428 C 196 512, 210 540, 216 566 C 210 592, 196 620, 168 712 C 236 652, 292 610, 352 588 Z" fill="url(#bodyGrad)"/>

  <!-- body -->
  <path d="M300 588 C 300 480, 404 414, 540 414 C 700 414, 792 496, 792 580 C 792 676, 690 742, 548 742 C 386 742, 300 686, 300 588 Z" fill="url(#bodyGrad)"/>

  <!-- belly -->
  <ellipse cx="576" cy="666" rx="176" ry="66" fill="#eef9ff" opacity="0.92"/>
  <path d="M470 700 C 520 726, 636 724, 686 690" stroke="#bfe6f7" stroke-width="6" fill="none" opacity="0.8"/>

  <!-- side fin -->
  <path d="M604 690 C 636 726, 690 742, 726 736 C 692 762, 636 754, 598 716 Z" fill="#2f92cc" opacity="0.95"/>

  <!-- little bow -->
  <g fill="#f6fbff">
    <path d="M520 404 C 486 372, 470 356, 452 360 C 440 386, 450 414, 474 428 Z"/>
    <path d="M540 402 C 570 368, 590 352, 608 358 C 618 384, 606 412, 582 426 Z"/>
    <circle cx="532" cy="418" r="17"/>
  </g>

  <!-- eye -->
  <circle cx="662" cy="540" r="34" fill="#08203c"/>
  <circle cx="674" cy="527" r="12" fill="#ffffff"/>
  <circle cx="650" cy="556" r="6" fill="#8fd6ff" opacity="0.9"/>

  <!-- blush -->
  <ellipse cx="608" cy="606" rx="34" ry="19" fill="#ff9dc0" opacity="0.55"/>
  <ellipse cx="742" cy="596" rx="22" ry="14" fill="#ff9dc0" opacity="0.4"/>

  <!-- mouth -->
  <path d="M676 606 C 692 626, 722 626, 738 606" stroke="#08203c" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- spout -->
  <g fill="#d9f6ff" opacity="0.92">
    <circle cx="512" cy="286" r="12"/>
    <circle cx="545" cy="252" r="9"/>
    <circle cx="478" cy="258" r="8"/>
    <path d="M498 340 C 508 316, 520 300, 528 292 C 522 314, 514 328, 508 344 Z" opacity="0.75"/>
  </g>

  <path d="M300 588 C 300 480, 404 414, 540 414" stroke="#c6ecff" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
